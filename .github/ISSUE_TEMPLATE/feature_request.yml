name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome. Please describe the problem you are trying to solve, not only the solution you have in mind.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain point or workflow gap does this address?
      placeholder: It is hard to review actions because...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about.
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: MVP intentionally requires human review and does not send email.
      options:
        - label: This feature keeps human approval in the loop
          required: false
        - label: I have read CONTRIBUTING.md scope guidance
          required: false
